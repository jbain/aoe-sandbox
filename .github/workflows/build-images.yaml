name: Build images

on:
  schedule:
    # Weekly, Mondays 06:00 UTC. The agents and the logseq nightly move fast,
    # so a rebuild is mostly about picking up new upstream releases.
    - cron: '0 6 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - '.github/workflows/build-images.yaml'
      - '.github/workflows/_build-image.yaml'

# Never let two runs push the same tags concurrently.
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  base:
    name: aoe-slim
    uses: ./.github/workflows/_build-image.yaml
    permissions:
      contents: read
      packages: write
    with:
      image: ghcr.io/jbain/aoe-slim
      slug: base
      dockerfile: ./docker/Dockerfile
    secrets:
      gh_token: ${{ secrets.GHCR_BUILD_TOKEN }}

  dev:
    name: aoe-slim-dev
    needs: base
    uses: ./.github/workflows/_build-image.yaml
    permissions:
      contents: read
      packages: write
    with:
      image: ghcr.io/jbain/aoe-slim-dev
      slug: dev
      dockerfile: ./docker/Dockerfile.dev
      # `:latest` resolves per-platform on each native runner, so the amd64 leg
      # pulls the amd64 base and the arm64 leg pulls the arm64 base.
      build-args: |
        BASE_IMAGE=ghcr.io/jbain/aoe-slim:latest
    secrets:
      # A PAT with `repo` scope while jbain/logseq-project-management is
      # private; also lifts the anonymous GitHub API rate limit for the logseq
      # nightly asset lookup. If the secret is unset the build still succeeds --
      # logseq-pm is skipped with a warning (see LOGSEQ_PM_OPTIONAL in
      # docker/Dockerfile.dev). Once the repo is public, drop the PAT and flip
      # LOGSEQ_PM_OPTIONAL to 0.
      gh_token: ${{ secrets.GHCR_BUILD_TOKEN }}

# ---------------------------------------------------------------------------
# Fallback: single-job QEMU build
#
