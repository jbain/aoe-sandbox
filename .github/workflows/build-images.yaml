# `ubuntu-24.04-arm` runner is free for public repositories; on a private repo
# it bills as a larger runner. If that is not acceptable, replace the two jobs
# above with the emulated form below -- correct, but substantially slower,
# because Chromium and the Electron bundle in the dev image are both painful
# under QEMU.
